 mng_secure_china_title: "Secure China"
 mng_secure_china_desc: "These warring states must be brought back under the authority of the Celestial Empire, CHINA MUST GROW LARGER"
 ajam_tabriz_title: "Tabriz"
 ajam_tabriz_desc: "The western gate of Persia, Tabriz must be conquered to protect our lands from any enemies coming from the west"
 ajam_amol_title: "Amol"
 ajam_amol_desc: "Amol is part of the rich lands on the coast of the Caspian Sea, conquest of this city will profit us greatly"
 ajam_start_title: "Securing the Region"
 ajam_start_desc: "We lie at the heart of Persia, it's only natural that we conquer the rest of it"
 ajam_shiraz_title: "Shiraz"
 ajam_shiraz_desc: "Deep in the south of Persia live the Farsi peoples, they live in the old Persian heartland where the once great city of Persepolis presided"
 ajam_mashhad_title: "Mashhad"
 ajam_mashhad_desc: "In the far eastern reaches of our domain is the important city of Masshad, once conquered by Timur, it lies open to be a part of Persia once again"
 frn_printing_press: "Frankfurt Printing Hub"
 START_ECONOMIC_GOLDEN_AGE:0 "£adm£Start Economic Golden Age"
 economic_golden_age_title:0 "This will start our Economic Golden Age which will last for 50 years."
 urbanisation_tt:0 "Must have §Y100§! Diplomatic Power, §Y100§! Administrative Power, §Y100§! Military Power and §Y200§! Splendor"
 frankfurt_expansion_start: "Frankfurter Resolve"
 frn_initial_expansion_title: "Frankfurt Sovereignity"
 frn_initial_expansion_desc: "We may be a free city, guaranteed by the emperor, as long as our region stays volatile and prone to conflict our people wont be safe. We'll enforce peace and stability by stripping nearby lords of their legal right to declare war."
 frn_hesse_title: "Conquering Hesse"
 frn_hesse_desc: "Hesse lies close to the heart of westphalia, to stabilize the region we need to take them out immediatly"
 frn_nassau_title: "Dominating Nassau"
 frn_nassau_desc: "The count of Nassau is a pushover, we must capitalize on this before someone else does"
 frn_mainz_title: "Overlordship over Mainz"
 frn_mainz_desc: "Mainz is one of the smaller electors within the empire, their elector title would suit us excellently"
 frn_integration_title: "A Grander Republic"
 frn_integration_desc: "All these territories that have come under our control would be better off if we directly administrated them, that would mean leaving our free city status behind, a small price to pay for liberating the wesphalian people"
 frn_paper_title: "Paper Industry"
 frn_paper_desc: "An industry is forming around the newly invented printing press, we must capitalize and support this innovation as it will no doubt gives us an advantagious position in the region soon"
 frn_imperial_support_title: "Imperial Support"
 frn_imperial_support_desc: "The emperor has always been a great benefactor to free cities like ours, with some political maneuvering we may be able to get some subsidies to help us out in future conflicts"
 frankfurt_integration_effect: "Integrates §YMainz, Nassau and Hesse§! if they're your subjects, if they aren't your subjects or don't exist you receive §Y50§! Monarch Power in a catagory corresponding to the nations"
 siam_growing_city_modifier: "Growing City of Ayutthaya"
 siam_revolution: "Siamese Revolution"
 hetmanate_reform: "Great Hetmanate"
 hetmanate_reform_desc: "The cossacks have been united under one banner, our cossack citizens get to vote on who becomes the ruler of all the cossacks, going by the title of Hetman."
 SRH_ideas: "Sirhind Ideas"
 SRH_ideas_start: "Sirhind Traditions"
 SRH_1: "Breadbasket of India"
 SRH_1_desc: "Lahore region has long been the premier agricultural region in all of India."
 SRH_2: "Religious Registries" 
 SRH_2_desc: "We require of the hindu religious institutions that they keep track of the population in their lands, this way we know exactly how many levies to expect when war comes around."
 SRH_3: "Weaving Traditions"
 SRH_3_desc: "The region has a rich history of weaving various cloths that get used all around the continent, some even being prized and traded in Europe and Africa."
 SRH_4: "Crossroads of India"
 SRH_4_desc: "Our lands lie at the gate to the Persian and Arabic traders, we must position ourselves as middlemen to maximize profits."
 SRH_5: "Religious Rule"
 SRH_5_desc: "Altought our governing class is largely muslim our subjects are hindu, we must lend them a little autonomy in order to keep the realm stable."
 SRH_6: "Cheap Equipment"
 SRH_6_desc: "We use our trade connections to provide our troops with cheap yet effective weapons, giving us the edge in any conflict."
 SRH_7: "Army Reform"
 SRH_7_desc: "Recent wars have shown that even slightly training our troops can have a significant effect in their combat effectiveness."
 
 # Buildings
 building_early_road: "Dirt Road"
 building_early_road_desc: "§gAs time passed, natural pathways evolved into dirt roads. It is essential to maintain and install signage to ensure their proper care and use.§!\n\n"
 building_gravel_road: "Gravel Road"
 building_gravel_road_desc: "§gGravel serves as a superior foundation for roads compared to basic compacted dirt.§!\n\n"
 building_royal_road: "Cobblestone Road"
 building_royal_road_desc: "§gCobblestone stands as an enhanced foundation for roads, surpassing gravel in terms of durability and aesthetic appeal.§!\n\n"
 building_macadam_road: "Macadam Road"
 building_macadam_road_desc: "§gMacadam roads mark a significant evolutionary leap beyond cobblestone, embodying the advancements in road construction pioneered by John Loudon McAdam in the early 19th century. McAdam's innovative technique involved layering crushed stones systematically, providing not only superior durability but also a remarkably smoother and more modern road surface.§!\n\n"
 building_railroad: "Railroads"
 building_railroad_desc: "§gThe introduction of the railroad, served as a transformative upgrade to traditional macadam roads, revolutionizing land connectivity and enabling faster and more efficient movement of goods and people.§!\n\n"
