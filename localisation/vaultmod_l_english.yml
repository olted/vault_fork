 vault_flavour.7.t: "A Promising Mercenary Commander"
 vault_flavour.7.d: "In recent years one man has proven himself the most capable commander the Russian people have ever seen, also known under his alias the Beast of Bahmut, Yevgeny Prigozhin has led the charge against our enemies in a loyal and fealess manner. We could promote him to supreme commander of our entire armed forces, we'll only have to provide him with ample munitions and the freedom to do as he wishes.
 vault_flavour.7.a: "Bring him back to his hotdog stand"
 vault_flavour.7.b: "LETO I ARBELET, ZA WAGNERA PODYEDUT!"
 vault_flavour.8.t: "Prigozhin"
 vault_flavour.8.d: "The vile dog Prigozhin has turned against us, we must crush all enemies of Russia!"
 vault_flavour.8.a: "Let one of our vassals deal with this imbicile"
 vault_flavour.9.t: "A promising young king"
 vault_flavour.9.d: "Some say he exploited to get into this position, others say he was destined to, either way we're stuck with him..."
 vault_flavour.9.a: "The chosen one is among us!"
