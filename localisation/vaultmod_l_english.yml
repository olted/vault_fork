 AFG_baluchistan_desc: "Nearly worthless, but not entirely"
 AFG_east_title: "Heading Eastwards"
 AFG_east_desc: "The richest lands lie to our east, we must focus our expansion there at once"
 AFG_delhi_title: "Defy Delhi"
 AFG_delhi_desc: "The lands of the rich Delhi sultanate would be an amazing source of power for our fledgling empire"
